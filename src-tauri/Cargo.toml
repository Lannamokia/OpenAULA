[package]
name = "openaula"
version = "1.1.0"
description = "Unofficial AULA keyboard driver (HERO 68 XS), protocol ported from spiderdriver"
authors = ["spiderdriver"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "openaula_lib"
crate-type = ["lib"]

[[bin]]
name = "openaula"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
hidapi = "2"
# 神光同步：WASAPI 回环采集（系统输出）+ FFT + Windows 主题色注册表读取。
wasapi = "0.25"
rustfft = "6"
winreg = "0.55"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# (none yet; examples use the lib directly)
