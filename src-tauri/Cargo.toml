[package]
name = "aula-driver"
version = "0.1.0"
description = "Unofficial AULA keyboard driver (HERO 68 XS), protocol ported from spiderdriver"
authors = ["spiderdriver"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aula_driver_lib"
crate-type = ["lib"]

[[bin]]
name = "aula-driver"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
hidapi = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# (none yet; examples use the lib directly)
